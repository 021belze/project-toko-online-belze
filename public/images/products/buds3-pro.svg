<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="case-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="lid-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="blade-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="buds-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Buds Charging Cradle Base -->
  <rect x="80" y="240" width="240" height="220" rx="60" fill="url(#case-body)" stroke="#cbd5e1" stroke-width="2" filter="url(#buds-shadow)" />

  <!-- Transparent Flip Lid -->
  <path d="M 80 310 C 80 230, 130 180, 200 180 C 270 180, 320 230, 320 310 Z" fill="url(#lid-glass)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Left Earbud (Blade Design) -->
  <g transform="translate(130, 230) rotate(-12)">
    <rect x="-12" y="0" width="24" height="90" rx="8" fill="url(#blade-stem)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Blade LED Light Strip -->
    <line x1="0" y1="12" x2="0" y2="78" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-6" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
    <circle cx="0" cy="-6" r="10" fill="#334155" />
  </g>

  <!-- Right Earbud (Blade Design) -->
  <g transform="translate(270, 230) rotate(12)">
    <rect x="-12" y="0" width="24" height="90" rx="8" fill="url(#blade-stem)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Blade LED Light Strip -->
    <line x1="0" y1="12" x2="0" y2="78" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-6" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
    <circle cx="0" cy="-6" r="10" fill="#334155" />
  </g>

  <!-- Front LED Status Dot & Brand -->
  <circle cx="200" cy="405" r="3.5" fill="#22c55e" />
  <text x="200" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#64748b" text-anchor="middle">SAMSUNG</text>
</svg>
