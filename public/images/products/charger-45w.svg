<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="charger-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="charger-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Europlug Prongs -->
  <rect x="155" y="100" width="16" height="70" rx="8" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" />
  <rect x="229" y="100" width="16" height="70" rx="8" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" />

  <!-- Charger Main Block -->
  <rect x="120" y="160" width="160" height="240" rx="28" fill="url(#charger-body)" stroke="#334155" stroke-width="2" filter="url(#charger-shadow)" />

  <!-- USB Type-C Port -->
  <rect x="165" y="420" width="70" height="18" rx="9" fill="#020617" stroke="#475569" stroke-width="1.5" />
  <rect x="175" y="426" width="50" height="6" rx="3" fill="#1e293b" />

  <!-- 45W Fast Charging Iconography -->
  <text x="200" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-1" fill="#38bdf8" text-anchor="middle">45W</text>
  <text x="200" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#94a3b8" text-anchor="middle">SUPER FAST CHARGING</text>
  <text x="200" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#e2e8f0" text-anchor="middle">SAMSUNG</text>
</svg>
