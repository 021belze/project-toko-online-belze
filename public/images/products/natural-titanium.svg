<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="body-nat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aba69e" />
      <stop offset="50%" stop-color="#918c84" />
      <stop offset="100%" stop-color="#78736b" />
    </linearGradient>
    <linearGradient id="frame-nat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5bfb6" />
      <stop offset="25%" stop-color="#8c877f" />
      <stop offset="75%" stop-color="#aba59b" />
      <stop offset="100%" stop-color="#736f68" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <rect x="70" y="30" width="260" height="520" rx="46" fill="url(#frame-nat)" stroke="#dcd5cb" stroke-width="2" filter="url(#shadow)" />
  <rect x="74" y="34" width="252" height="512" rx="42" fill="url(#body-nat)" />
  
  <!-- Camera Island -->
  <rect x="88" y="52" width="106" height="114" rx="28" fill="#817c74" stroke="#a49e95" stroke-width="2" />
  
  <!-- Lens 1 -->
  <circle cx="120" cy="84" r="22" fill="#201f1e" stroke="#aba49b" stroke-width="3"/>
  <circle cx="120" cy="84" r="14" fill="#080808"/>
  <circle cx="116" cy="80" r="4" fill="#60a5fa" opacity="0.7"/>

  <!-- Lens 2 -->
  <circle cx="120" cy="134" r="22" fill="#201f1e" stroke="#aba49b" stroke-width="3"/>
  <circle cx="120" cy="134" r="14" fill="#080808"/>
  <circle cx="116" cy="130" r="4" fill="#60a5fa" opacity="0.7"/>

  <!-- Lens 3 -->
  <circle cx="164" cy="109" r="22" fill="#201f1e" stroke="#aba49b" stroke-width="3"/>
  <circle cx="164" cy="109" r="14" fill="#080808"/>
  <circle cx="160" cy="105" r="4" fill="#60a5fa" opacity="0.7"/>

  <!-- Flash & Sensor -->
  <circle cx="164" cy="68" r="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" opacity="0.9"/>
  <circle cx="164" cy="148" r="5" fill="#3f3d3a"/>

  <!-- Logo -->
  <circle cx="200" cy="290" r="14" fill="none" stroke="#68635c" stroke-width="3"/>
  <path d="M194 290 Q200 282 206 290 Q200 298 194 290 Z" fill="#68635c" />

  <text x="200" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#3e3b36" text-anchor="middle" letter-spacing="3">NATURAL TITANIUM</text>
</svg>
