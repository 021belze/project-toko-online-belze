<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="frame-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="30%" stop-color="#132338" />
      <stop offset="70%" stop-color="#1e1833" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
    <radialGradient id="wallpaper-orb" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Titanium Outer Frame -->
  <rect x="75" y="32" width="250" height="516" rx="20" fill="url(#frame-front)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
  
  <!-- Symmetrical Bezel & Dynamic AMOLED Screen -->
  <rect x="79" y="36" width="242" height="508" rx="16" fill="url(#screen-glow)" />
  <rect x="79" y="36" width="242" height="508" rx="16" fill="url(#wallpaper-orb)" />

  <!-- Infinity-O Punch Hole Front Camera -->
  <circle cx="200" cy="54" r="5" fill="#020617" stroke="#334155" stroke-width="1" />
  <circle cx="200" cy="54" r="2.5" fill="#082f49" />

  <!-- Lock Screen Clock & Date -->
  <text x="200" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="200" fill="#f8fafc" text-anchor="middle" letter-spacing="-1">09:41</text>
  <text x="200" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Jumat, 24 Oktober 2026</text>

  <!-- Galaxy AI Widget Pill -->
  <g transform="translate(110, 230)">
    <rect width="180" height="42" rx="21" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="22" cy="21" r="10" fill="#0284c7" fill-opacity="0.2" />
    <path d="M22 15 L23.5 19.5 L28 21 L23.5 22.5 L22 27 L20.5 22.5 L16 21 L20.5 19.5 Z" fill="#38bdf8" />
    <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Galaxy AI Assistant</text>
  </g>

  <!-- Lockscreen Quick Notification Card -->
  <g transform="translate(100, 310)">
    <rect width="200" height="64" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="26" r="10" fill="#16a34a" />
    <path d="M20 26 L23 29 L28 22" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Garansi Resmi SEIN Aktif</text>
    <text x="42" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Unit 100% Terdaftar Kemenperin</text>
  </g>

  <!-- Ultrasonic Fingerprint Sensor Target -->
  <g transform="translate(200, 440)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
  </g>

  <!-- Bottom Navigation Pill -->
  <rect x="160" y="525" width="80" height="4" rx="2" fill="#cbd5e1" opacity="0.7" />
</svg>
