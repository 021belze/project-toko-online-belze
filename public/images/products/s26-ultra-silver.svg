<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="body-s26-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd6dc" />
      <stop offset="50%" stop-color="#b0b8c0" />
      <stop offset="100%" stop-color="#8c959e" />
    </linearGradient>
    <linearGradient id="frame-s26-silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Galaxy S26 Ultra Chassis - Sharp Titanium Boxy Silhouette -->
  <rect x="75" y="32" width="250" height="516" rx="20" fill="url(#frame-s26-silver)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)" />
  <!-- Inner Back Glass -->
  <rect x="79" y="36" width="242" height="508" rx="16" fill="url(#body-s26-silver)" />

  <!-- Samsung Floating Lens Array (Iconic Ultra Design) -->
  <!-- Main 200MP Lens -->
  <circle cx="120" cy="85" r="22" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <circle cx="120" cy="85" r="14" fill="#020617" />
  <circle cx="116" cy="81" r="4" fill="#0284c7" opacity="0.8" />

  <!-- Ultra Wide Lens -->
  <circle cx="120" cy="145" r="22" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <circle cx="120" cy="145" r="14" fill="#020617" />
  <circle cx="116" cy="141" r="4" fill="#0284c7" opacity="0.8" />

  <!-- Periscope Telephoto Lens (Square cut inside) -->
  <circle cx="120" cy="205" r="22" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <rect x="110" y="195" width="20" height="20" rx="3" fill="#020617" />
  <circle cx="117" cy="202" r="3" fill="#38bdf8" opacity="0.8" />

  <!-- Secondary Column: Laser AF, Flash, 3x Telephoto -->
  <circle cx="166" cy="85" r="11" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <circle cx="166" cy="125" r="8" fill="#fef08a" stroke="#e2e8f0" stroke-width="2" /> <!-- LED Flash -->
  <circle cx="166" cy="165" r="13" fill="#0f172a" stroke="#475569" stroke-width="2" /> <!-- 3x Telephoto -->

  <!-- Subtle Samsung Logo -->
  <text x="200" y="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#334155" text-anchor="middle" opacity="0.7">SAMSUNG</text>
  <!-- Model Tag -->
  <text x="200" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#475569" text-anchor="middle" opacity="0.6">GALAXY S26 ULTRA</text>
</svg>
