<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="watch-strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="watch-cushion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="watch-dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="watch-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Straps Top & Bottom -->
  <rect x="135" y="40" width="130" height="150" rx="16" fill="url(#watch-strap)" opacity="0.9" />
  <rect x="135" y="410" width="130" height="150" rx="16" fill="url(#watch-strap)" opacity="0.9" />

  <!-- Cushion Body (Squircle Titanium) -->
  <rect x="90" y="190" width="220" height="220" rx="56" fill="url(#watch-cushion)" stroke="#cbd5e1" stroke-width="3" filter="url(#watch-shadow)" />

  <!-- Accent Bezel Ring -->
  <circle cx="200" cy="300" r="92" fill="#0f172a" stroke="#f97316" stroke-width="4" />
  <circle cx="200" cy="300" r="86" fill="url(#watch-dial)" stroke="#334155" stroke-width="2" />

  <!-- Dial Display UI -->
  <text x="200" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#f97316" text-anchor="middle">OCT 16</text>
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="#ffffff" text-anchor="middle">10:08</text>
  <text x="200" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">♥ 72 BPM • 4,820 STEPS</text>

  <!-- Crown Button Orange Accent -->
  <rect x="312" y="278" width="12" height="44" rx="4" fill="#f97316" stroke="#ea580c" stroke-width="1.5" />
  <rect x="76" y="278" width="12" height="44" rx="4" fill="#64748b" />
</svg>
