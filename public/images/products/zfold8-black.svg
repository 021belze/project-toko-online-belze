<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="body-fold-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2024" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#08090a" />
    </linearGradient>
    <linearGradient id="hinge-black" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#383a42" />
      <stop offset="50%" stop-color="#24262b" />
      <stop offset="100%" stop-color="#16171a" />
    </linearGradient>
    <filter id="shadow-fold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Hinge Edge (Armor Aluminum) -->
  <rect x="76" y="28" width="18" height="534" rx="6" fill="url(#hinge-black)" stroke="#383a42" stroke-width="1.5" />

  <!-- Main Fold Body Silhouette -->
  <rect x="90" y="28" width="234" height="534" rx="22" fill="#1e2024" stroke="#383a42" stroke-width="2" filter="url(#shadow-fold)" />
  <rect x="94" y="32" width="226" height="526" rx="18" fill="url(#body-fold-black)" />

  <!-- Modern Raised Camera Island -->
  <rect x="110" y="55" width="58" height="180" rx="28" fill="#141518" stroke="#31333a" stroke-width="2" />

  <!-- Lens 1 (50MP Dual Pixel) -->
  <circle cx="139" cy="88" r="20" fill="#090a0c" stroke="#3f424b" stroke-width="2.5" />
  <circle cx="139" cy="88" r="12" fill="#020304" />
  <circle cx="136" cy="85" r="3.5" fill="#38bdf8" opacity="0.7" />

  <!-- Lens 2 (12MP Ultra Wide) -->
  <circle cx="139" cy="145" r="20" fill="#090a0c" stroke="#3f424b" stroke-width="2.5" />
  <circle cx="139" cy="145" r="12" fill="#020304" />
  <circle cx="136" cy="142" r="3.5" fill="#38bdf8" opacity="0.7" />

  <!-- Lens 3 (10MP Telephoto 3x) -->
  <circle cx="139" cy="202" r="20" fill="#090a0c" stroke="#3f424b" stroke-width="2.5" />
  <circle cx="139" cy="202" r="12" fill="#020304" />
  <circle cx="136" cy="199" r="3.5" fill="#38bdf8" opacity="0.7" />

  <!-- Flash outside island -->
  <circle cx="184" cy="90" r="7" fill="#fef08a" stroke="#475569" stroke-width="2" />

  <text x="210" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#64748b" text-anchor="middle" opacity="0.6">SAMSUNG</text>
  <text x="210" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#475569" text-anchor="middle" opacity="0.5">GALAXY Z FOLD8 5G</text>
</svg>
